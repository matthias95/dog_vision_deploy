<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Dog Vision</title>
<script>
(function() {
  var lang = (navigator.language || 'de').split('-')[0];
  var supported = { de: true, en: true };
  window.location.replace('/' + (supported[lang] ? lang : 'de') + '/');
})();
</script>
</head>
<body>
<p><a href="/de/">Deutsch</a> | <a href="/en/">English</a></p>
</body>
</html>
